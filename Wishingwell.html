<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 背景图片 */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('e06302a0ce3ffdbafbb6fff446e14861.jpg') center/cover no-repeat;
            z-index: -2;
        }

        /* 背景遮罩，让文字更清晰 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        /* ========== 下雨动画 ========== */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            display: none;
        }

        .rain-container.active {
            display: block;
        }

        .raindrop {
            position: absolute;
            width: 1.5px;
            background: linear-gradient(to bottom, transparent, rgba(174, 194, 224, 0.6), rgba(174, 194, 224, 0.9));
            border-radius: 1px;
            animation: fall linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(100vh) translateX(20px);
                opacity: 0;
            }
        }

        /* 雨滴溅起效果 */
        .splash {
            position: absolute;
            bottom: 0;
            width: 2px;
            height: 2px;
            background: rgba(174, 194, 224, 0.5);
            border-radius: 50%;
            animation: splashAnim 0.4s ease-out forwards;
        }

        @keyframes splashAnim {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* 雨声控制按钮 */
        .rain-toggle {
            position: fixed;
            top: 20px;
            right: 74px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .rain-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .rain-toggle.active {
            background: rgba(100, 180, 255, 0.3);
            border-color: rgba(100, 180, 255, 0.5);
        }

        /* ========== 烟花 Canvas ========== */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* 登录页面 */
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card h1 {
            text-align: center;
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        .glass-card .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 36px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-family: inherit;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #ff9e9e;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            height: 20px;
        }

        .error-msg.show {
            opacity: 1;
        }

        /* 许愿页面 */
        .wish-page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.6s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .wish-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .wish-title {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .wish-hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .wish-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .wish-input {
            width: 100%;
            padding: 18px 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .wish-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .wish-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .wish-btn {
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-family: inherit;
        }

        .wish-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        /* 对话框 */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .dialog-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .dialog-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 36px 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            transition: transform 0.4s ease;
        }

        .dialog-overlay.show .dialog-box {
            transform: scale(1);
        }

        .dialog-box p {
            color: #fff;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .dialog-btn {
            padding: 12px 36px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-family: inherit;
        }

        .dialog-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* 淡入淡出动画 */
        .fade-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 28px 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }

        .fade-dialog.show {
            opacity: 1;
        }

        .fade-dialog p {
            color: #fff;
            font-size: 16px;
            line-height: 1.6;
        }

        /* 音频播放器 */
        .audio-player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .audio-player-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .audio-player-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .audio-player-box h3 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .play-btn.playing {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
        }

        .audio-status {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .close-audio-btn {
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-family: inherit;
        }

        .close-audio-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 许愿历史 */
        .wish-history {
            margin-top: 30px;
            max-height: 200px;
            overflow-y: auto;
        }

        .wish-history::-webkit-scrollbar {
            width: 4px;
        }

        .wish-history::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
        }

        .wish-history::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .wish-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            text-align: left;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .wish-item .wish-num {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-right: 8px;
        }

        /* 背景音乐控制 */
        .bgm-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .bgm-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bgm-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .bgm-btn.playing {
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 星星装饰 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: var(--opacity); }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .glass-card {
                padding: 36px 24px;
            }
            .glass-card h1 {
                font-size: 26px;
            }
            .wish-title {
                font-size: 24px;
            }
        }
    </style>

    </audio>

    <!-- 背景音乐控制 -->

    </div>

    <!-- 下雨控制 -->
    <button class="rain-toggle" id="rainToggle" title="切换下雨">🌧️</button>

    <!-- 登录页面 -->
    <div class="login-page" id="loginPage">
        <div class="glass-card">
            <h1>Happy Birthday</h1>
            <p class="subtitle">愿你的每一天都充满阳光与欢笑</p>

    <div class="wish-page" id="wishPage">

            <p class="wish-hint">闭上眼睛，许下最美好的心愿吧（试试输入"生日快乐"有惊喜哦）</p>

            <h3>🎵 LQJ 的声音</h3>
            <button class="play-btn" id="playBtn">▶</button>

    <script>
        // ========== 星星背景 ==========
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
                star.style.setProperty('--opacity', 0.3 + Math.random() * 0.7);
                star.style.animationDelay = Math.random() * 5 + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // ========== 下雨动画 ==========
        const rainContainer = document.getElementById('rainContainer');
        const rainToggle = document.getElementById('rainToggle');
        let isRaining = false;
        let rainInterval = null;
        let rainDrops = [];

        function createRaindrop() {
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            const left = Math.random() * 100;
            const height = 15 + Math.random() * 25;
            const duration = 0.6 + Math.random() * 0.8;
            const delay = Math.random() * 0.5;

            drop.style.left = left + '%';
            drop.style.height = height + 'px';
            drop.style.animationDuration = duration + 's';
            drop.style.animationDelay = delay + 's';
            drop.style.top = '-50px';

            rainContainer.appendChild(drop);
            rainDrops.push(drop);

            // 移除超出屏幕的雨滴
            setTimeout(() => {
                if (drop.parentNode) {
                    drop.parentNode.removeChild(drop);
                }
                rainDrops = rainDrops.filter(d => d !== drop);
            }, (duration + delay) * 1000 + 100);
        }

        function startRain() {
            if (rainInterval) return;
            rainContainer.classList.add('active');
            rainToggle.classList.add('active');
            // 初始创建一批雨滴
            for (let i = 0; i < 40; i++) {
                setTimeout(() => createRaindrop(), Math.random() * 1000);
            }
            // 持续生成
            rainInterval = setInterval(() => {
                createRaindrop();
                createRaindrop();
            }, 80);
            isRaining = true;
        }

        function stopRain() {
            if (rainInterval) {
                clearInterval(rainInterval);
                rainInterval = null;
            }
            rainContainer.classList.remove('active');
            rainToggle.classList.remove('active');
            rainDrops.forEach(d => {
                if (d.parentNode) d.parentNode.removeChild(d);
            });
            rainDrops = [];
            isRaining = false;
        }

        rainToggle.addEventListener('click', () => {
            if (isRaining) {
                stopRain();
            } else {
                startRain();
            }
        });

        // ========== 登录逻辑 ==========
        const CORRECT_USERNAME = 'LSR';
        const CORRECT_PASSWORD = '261001';

        const loginPage = document.getElementById('loginPage');
        const wishPage = document.getElementById('wishPage');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const bgmControl = document.getElementById('bgmControl');
        const bgmBtn = document.getElementById('bgmBtn');
        const bgMusic = document.getElementById('bgMusic');

        function doLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                loginPage.style.display = 'none';
                wishPage.style.display = 'flex';
                bgmControl.style.display = 'block';
                rainToggle.style.display = 'flex';

                // 尝试自动播放背景音乐
                bgMusic.volume = 0.4;
                bgMusic.play().catch(() => {
                    // 自动播放被阻止，等用户交互后再试
                });

                // 聚焦到许愿输入框
                setTimeout(() => document.getElementById('wishInput').focus(), 500);
            } else {
                errorMsg.classList.add('show');
                setTimeout(() => errorMsg.classList.remove('show'), 2500);
            }
        }

        loginBtn.addEventListener('click', doLogin);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') passwordInput.focus();
        });

        // 背景音乐控制
        let isBgmPlaying = false;
        bgmBtn.addEventListener('click', () => {
            if (isBgmPlaying) {
                bgMusic.pause();
                bgmBtn.classList.remove('playing');
                bgmBtn.textContent = '🎵';
            } else {
                bgMusic.play().then(() => {
                    bgmBtn.classList.add('playing');
                    bgmBtn.textContent = '♪';
                }).catch(() => {
                    alert('音频加载失败，请检查文件路径');
                });
            }
            isBgmPlaying = !isBgmPlaying;
        });

        // ========== 烟花文字效果 ==========
        const fwCanvas = document.getElementById('fireworksCanvas');
        const fwCtx = fwCanvas.getContext('2d');
        let fwAnimationId = null;
        let fwParticles = [];
        let fwRockets = [];

        function resizeFwCanvas() {
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
        }
        resizeFwCanvas();
        window.addEventListener('resize', resizeFwCanvas);

        // 获取文字像素点
        function getTextPixels(text, fontSize) {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = fwCanvas.width;
            offCanvas.height = fwCanvas.height;

            offCtx.font = `bold ${fontSize}px 'Noto Sans SC', sans-serif`;
            offCtx.fillStyle = 'white';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2);

            const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            const pixels = [];
            const step = 4; // 采样步长，控制密度

            for (let y = 0; y < offCanvas.height; y += step) {
                for (let x = 0; x < offCanvas.width; x += step) {
                    const idx = (y * offCanvas.width + x) * 4;
                    if (imageData.data[idx + 3] > 128) {
                        pixels.push({ x, y });
                    }
                }
            }
            return pixels;
        }

        class Rocket {
            constructor(targetX, targetY) {
                this.x = targetX + (Math.random() - 0.5) * 100;
                this.y = fwCanvas.height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.vx = (targetX - this.x) * 0.015;
                this.vy = -12 - Math.random() * 4;
                this.trail = [];
                this.exploded = false;
                this.color = `hsl(${Math.random() * 60 + 10}, 100%, 60%)`;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 15) this.trail.shift();

                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15; // 重力

                if (this.vy >= 0 || this.y <= this.targetY) {
                    this.exploded = true;
                    return true;
                }
                return false;
            }

            draw(ctx) {
                ctx.save();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < this.trail.length - 1; i++) {
                    ctx.moveTo(this.trail[i].x, this.trail[i].y);
                    ctx.lineTo(this.trail[i + 1].x, this.trail[i + 1].y);
                }
                ctx.stroke();
                ctx.restore();
            }
        }

        class TextParticle {
            constructor(x, y, targetX, targetY, color) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.color = color;
                this.alpha = 1;
                this.size = 2 + Math.random() * 2;
                this.arrived = false;
                this.delay = Math.random() * 20;
                this.life = 0;
            }

            update() {
                if (this.delay > 0) {
                    this.delay--;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.95;
                    this.vy *= 0.95;
                    return;
                }

                this.life++;

                if (!this.arrived) {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 3) {
                        this.arrived = true;
                        this.x = this.targetX;
                        this.y = this.targetY;
                    } else {
                        this.vx += dx * 0.008;
                        this.vy += dy * 0.008;
                        this.vx *= 0.92;
                        this.vy *= 0.92;
                        this.x += this.vx;
                        this.y += this.vy;
                    }
                }

                // 停留一段时间后淡出
                if (this.life > 200) {
                    this.alpha -= 0.008;
                }
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class NormalParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.alpha = 1;
                this.size = 1.5 + Math.random() * 2;
                this.gravity = 0.08;
                this.friction = 0.96;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.alpha -= 0.008;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 4;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function launchTextFireworks() {
            const text = "Happy Birthday";
            const fontSize = Math.min(fwCanvas.width / 8, 80);
            const textPixels = getTextPixels(text, fontSize);

            if (textPixels.length === 0) return;

            // 打乱像素点，随机分配给不同火箭
            const shuffled = [...textPixels].sort(() => Math.random() - 0.5);
            const batchSize = Math.ceil(shuffled.length / 5);
            const colors = [
                '#FFD700', '#FF6B9D', '#4ECDC4', '#FF8C42', '#A8E6CF',
                '#FF1744', '#E040FB', '#FF9100', '#76FF03', '#00E5FF'
            ];

            // 发射5个火箭，在不同位置爆炸
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const batch = shuffled.slice(i * batchSize, (i + 1) * batchSize);
                    if (batch.length === 0) return;

                    const avgX = batch.reduce((s, p) => s + p.x, 0) / batch.length;
                    const avgY = batch.reduce((s, p) => s + p.y, 0) / batch.length;

                    const rocket = new Rocket(avgX, avgY);

                    // 覆盖原update，在爆炸时生成文字粒子
                    const originalUpdate = rocket.update.bind(rocket);
                    rocket.update = function() {
                        const shouldExplode = originalUpdate();
                        if (shouldExplode && !this.explodedFlag) {
                            this.explodedFlag = true;
                            const color = colors[i % colors.length];

                            // 生成文字粒子
                            batch.forEach(p => {
                                fwParticles.push(new TextParticle(
                                    this.x, this.y,
                                    p.x, p.y,
                                    color
                                ));
                            });

                            // 额外生成一些普通烟花粒子增加效果
                            for (let j = 0; j < 30; j++) {
                                fwParticles.push(new NormalParticle(this.x, this.y, color));
                            }
                        }
                        return false;
                    };

                    fwRockets.push(rocket);
                }, i * 400);
            }

            // 额外发射一些装饰火箭
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const rx = Math.random() * fwCanvas.width;
                    const ry = fwCanvas.height * 0.2 + Math.random() * fwCanvas.height * 0.3;
                    const rocket = new Rocket(rx, ry);
                    const originalUpdate = rocket.update.bind(rocket);
                    const decoColor = colors[Math.floor(Math.random() * colors.length)];

                    rocket.update = function() {
                        const shouldExplode = originalUpdate();
                        if (shouldExplode && !this.explodedFlag) {
                            this.explodedFlag = true;
                            for (let j = 0; j < 60; j++) {
                                fwParticles.push(new NormalParticle(this.x, this.y, decoColor));
                            }
                        }
                        return false;
                    };
                    fwRockets.push(rocket);
                }, 2000 + i * 600);
            }

            startFwAnimation();
        }

        function startFwAnimation() {
            if (fwAnimationId) return;

            function animate() {
                fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

                // 更新火箭
                fwRockets = fwRockets.filter(r => {
                    r.update();
                    r.draw(fwCtx);
                    return !r.explodedFlag;
                });

                // 更新粒子
                fwParticles = fwParticles.filter(p => {
                    p.update();
                    p.draw(fwCtx);
                    return p.alpha > 0;
                });

                if (fwRockets.length > 0 || fwParticles.length > 0) {
                    fwAnimationId = requestAnimationFrame(animate);
                } else {
                    fwAnimationId = null;
                    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
                }
            }

            animate();
        }

        // ========== 许愿逻辑 ==========
        const wishInput = document.getElementById('wishInput');
        const wishBtn = document.getElementById('wishBtn');
        const wishHistory = document.getElementById('wishHistory');
        const dialogOverlay = document.getElementById('dialogOverlay');
        const dialogText = document.getElementById('dialogText');
        const dialogBtn = document.getElementById('dialogBtn');
        const fadeDialog = document.getElementById('fadeDialog');
        const fadeDialogText = document.getElementById('fadeDialogText');
        const audioOverlay = document.getElementById('audioOverlay');
        const playBtn = document.getElementById('playBtn');
        const audioStatus = document.getElementById('audioStatus');
        const closeAudioBtn = document.getElementById('closeAudioBtn');
        const lqjAudio = document.getElementById('lqjAudio');

        let wishCount = 0;
        let isWaitingForReWish = false;
        let hasShownFinalDialog = false;
        let isAudioPlaying = false;

        // 显示确认对话框
        function showDialog(text, onConfirm) {
            dialogText.textContent = text;
            dialogOverlay.classList.add('show');
            dialogBtn.onclick = () => {
                dialogOverlay.classList.remove('show');
                if (onConfirm) onConfirm();
            };
        }

        // 显示淡入淡出对话框
        function showFadeDialog(text, duration = 2500) {
            fadeDialogText.textContent = text;
            fadeDialog.classList.add('show');
            setTimeout(() => {
                fadeDialog.classList.remove('show');
            }, duration);
        }

        // 添加愿望到历史
        function addWishToHistory(wish, num) {
            const item = document.createElement('div');
            item.className = 'wish-item';
            item.innerHTML = `<span class="wish-num">#${num}</span>${wish}`;
            wishHistory.insertBefore(item, wishHistory.firstChild);
        }

        function makeWish() {
            const wish = wishInput.value.trim();
            if (!wish) return;

            // 检查是否是特殊指令：生日快乐
            if (wish === '生日快乐') {
                wishInput.value = '';
                launchTextFireworks();
                showFadeDialog('🎉 生日快乐！愿所有美好如期而至 🎂', 1000);
                return;
            }

            // 检查是否是特殊指令：LQJ的声音
            if (wish === '想听听 LQJ 的声音') {
                wishInput.value = '';
                audioOverlay.classList.add('show');
                return;
            }

            wishInput.value = '';

            // 如果正在等待重新输入第4次愿望
            if (isWaitingForReWish) {
                isWaitingForReWish = false;
                wishCount++;
                addWishToHistory(wish, wishCount);
                showDialog('最后两次许愿喽', () => {
                    wishInput.focus();
                });
                return;
            }

            wishCount++;
            addWishToHistory(wish, wishCount);

            switch (wishCount) {
                case 1:
                    showFadeDialog('你的愿望很快就会实现的', 2500);
                    break;
                case 2:
                    showFadeDialog('你还有一次许愿的机会', 2500);
                    break;
                case 3:
                    showFadeDialog('许愿次数已用尽', 2500);
                    break;
                case 4:
                    wishCount--;
                    if (wishHistory.firstChild) {
                        wishHistory.removeChild(wishHistory.firstChild);
                    }
                    isWaitingForReWish = true;
                    showDialog('你有点小贪心啊，那就再给你两次机会吧.', () => {
                        wishInput.focus();
                    });
                    break;
                case 5:
                    showDialog('这真的是最后一次许愿喽', () => {
                        wishInput.focus();
                    });
                    break;
                case 6:
                    if (!hasShownFinalDialog) {
                        hasShownFinalDialog = true;
                        showDialog('好了好了，随便你许多少愿望，你开心就好ˉ﹃ˉ', () => {
                            wishInput.focus();
                        });
                    }
                    break;
                default:
                    break;
            }
        }

        wishBtn.addEventListener('click', makeWish);
        wishInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') makeWish();
        });

        // ========== 音频播放 ==========
        playBtn.addEventListener('click', () => {
            if (isAudioPlaying) {
                lqjAudio.pause();
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing');
                audioStatus.textContent = '点击播放';
            } else {
                lqjAudio.play().then(() => {
                    playBtn.textContent = '⏸';
                    playBtn.classList.add('playing');
                    audioStatus.textContent = '正在播放...';
                }).catch(() => {
                    audioStatus.textContent = '音频加载失败，请检查文件路径';
                });
            }
            isAudioPlaying = !isAudioPlaying;
        });

        lqjAudio.addEventListener('ended', () => {
            isAudioPlaying = false;
            playBtn.textContent = '▶';
            playBtn.classList.remove('playing');
            audioStatus.textContent = '点击播放';
        });

        closeAudioBtn.addEventListener('click', () => {
            lqjAudio.pause();
            isAudioPlaying = false;
            playBtn.textContent = '▶';
            playBtn.classList.remove('playing');
            audioStatus.textContent = '点击播放';
            audioOverlay.classList.remove('show');
            wishInput.focus();
        });

        audioOverlay.addEventListener('click', (e) => {
            if (e.target === audioOverlay) {
                closeAudioBtn.click();
            }
        });
    </script>
